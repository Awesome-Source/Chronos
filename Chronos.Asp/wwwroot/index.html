<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chronos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
      </div>
      <div>
        <div class="brand-name">CHRONOS</div>
        <span class="brand-sub">Time tracking</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="nav-foot">Local time tracking</div>
  </aside>

  <div class="main">
    <div class="statusbar" id="statusbar"></div>
    <div class="page" id="page-dashboard"></div>
    <div class="page" id="page-tracking"></div>
    <div class="page" id="page-records"></div>
    <div class="page" id="page-timesheet"></div>
    <div class="page" id="page-statistics"></div>
    <div class="page" id="page-masterdata"></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop"></div>

<div class="modal" id="modal-new-activity">
  <div class="modal-head"><h2>New activity</h2><button class="btn-ghost row-icon-btn" onclick="closeModals()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="modal-body">
    <div class="field">
      <label for="na-activity">Activity</label>
      <select id="na-activity"></select>
    </div>
    <div class="field">
      <label for="na-objective">Objective</label>
      <select id="na-objective"></select>
    </div>
    <div class="field-check">
      <input type="checkbox" id="na-planned">
      <label for="na-planned">This work is planned</label>
    </div>
  </div>
  <div class="modal-actions">
    <button class="btn btn-outline" onclick="closeModals()">Cancel</button>
    <button class="btn btn-primary" onclick="submitNewActivity()">Add to today</button>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/icons.js"></script>
<script src="js/format.js"></script>
<script src="js/state.js"></script>
<script src="js/api.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/tracking.js"></script>
<script src="js/views/records.js"></script>
<script src="js/views/timesheet.js"></script>
<script src="js/views/statistics.js"></script>
<script src="js/views/masterdata.js"></script>
<script src="js/app.js"></script>
</body>
</html>
