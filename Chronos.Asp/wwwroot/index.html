<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chronos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
      </div>
      <div>
        <div class="brand-name">CHRONOS</div>
        <span class="brand-sub">Time tracking</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="nav-foot">Local time tracking</div>
  </aside>

  <div class="main">
    <div class="statusbar" id="statusbar"></div>
    <div class="page page-fill" id="page-dashboard"></div>
    <div class="page" id="page-tracking"></div>
    <div class="page" id="page-records"></div>
    <div class="page page-fill" id="page-timesheet"></div>
    <div class="page" id="page-statistics"></div>
    <div class="page" id="page-masterdata"></div>
  </div>
</div>

<div class="modal-backdrop" id="modal-backdrop"></div>

<div class="modal modal-wide" id="modal-new-tracking-target">
  <div class="modal-head"><h2>New tracking target</h2><button class="btn-ghost row-icon-btn" onclick="closeModals()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="modal-body">
    <div class="tabs">
      <button class="tab-btn" data-nt-tab="existing" onclick="setNewTargetTab('existing')">Existing objective</button>
      <button class="tab-btn" data-nt-tab="new" onclick="setNewTargetTab('new')">New objective</button>
    </div>
    <div class="tab-panel" id="nt-existing">
      <div class="field">
        <label for="na-activity-trigger">Activity</label>
        <div id="na-activity"></div>
      </div>
      <div class="field">
        <label for="na-objective-trigger">Objective</label>
        <div id="na-objective"></div>
      </div>
      <div class="field-check">
        <input type="checkbox" id="na-planned">
        <label for="na-planned">This work is planned</label>
      </div>
    </div>
    <div class="tab-panel" id="nt-new">
      <div class="field">
        <label for="nn-activity-trigger">Activity</label>
        <div id="nn-activity"></div>
      </div>
      <div class="field">
        <label for="nn-name">Objective name</label>
        <input type="text" id="nn-name">
      </div>
      <div class="field">
        <label for="nn-description">Description</label>
        <textarea id="nn-description"></textarea>
      </div>
      <div class="field">
        <label for="nn-category">Category</label>
        <select id="nn-category"></select>
      </div>
      <div class="field-check">
        <input type="checkbox" id="nn-planned">
        <label for="nn-planned">This work is planned</label>
      </div>
    </div>
  </div>
  <div class="modal-actions">
    <button class="btn btn-outline" onclick="closeModals()">Cancel</button>
    <button class="btn btn-primary" onclick="submitNewTrackingTarget()">Add to today</button>
  </div>
</div>

<div class="modal modal-wide" id="modal-new-record">
  <div class="modal-head"><h2>Add record</h2><button class="btn-ghost row-icon-btn" onclick="closeModals()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="modal-body">
    <div class="field-row">
      <div class="field">
        <label for="nr-start">Start</label>
        <input type="time" step="1" id="nr-start">
      </div>
      <div class="field">
        <label for="nr-end">End</label>
        <input type="time" step="1" id="nr-end">
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn" data-nr-tab="existing" onclick="setNewRecordTab('existing')">Existing tracking target</button>
      <button class="tab-btn" data-nr-tab="new" onclick="setNewRecordTab('new')">New tracking target</button>
    </div>
    <div class="tab-panel" id="nr-existing">
      <div class="field">
        <label for="nr-target-trigger">Tracking target</label>
        <div id="nr-target"></div>
      </div>
    </div>
    <div class="tab-panel" id="nr-new">
      <div class="field">
        <label for="nr-activity-trigger">Activity</label>
        <div id="nr-activity"></div>
      </div>
      <div class="field">
        <label for="nr-objective-trigger">Objective</label>
        <div id="nr-objective"></div>
      </div>
      <div class="field-check">
        <input type="checkbox" id="nr-planned">
        <label for="nr-planned">This work is planned</label>
      </div>
    </div>
  </div>
  <div class="modal-actions">
    <button class="btn btn-outline" onclick="closeModals()">Cancel</button>
    <button class="btn btn-primary" onclick="submitNewRecord()">Add record</button>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/icons.js"></script>
<script src="js/format.js"></script>
<script src="js/dom.js"></script>
<script src="js/charts.js"></script>
<script src="js/tabledropdown.js"></script>
<script src="js/state.js"></script>
<script src="js/api.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/tracking.js"></script>
<script src="js/views/records.js"></script>
<script src="js/views/timesheet.js"></script>
<script src="js/views/statistics.js"></script>
<script src="js/views/masterdata.js"></script>
<script src="js/app.js"></script>
</body>
</html>
